<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Поиск</title>
</head>
<body>
    <h2>Поиск</h2>
    <form method="POST" action="/search">
        <label>Поисковый запрос</label><br>
        <input type="text" name="query" /><br><br>

        <label>Страница</label><br>
        <input type="number" name="page" /><br><br>

        <label>Результатов на странице</label><br>
        <input type="number" name="limit" /><br><br>

        <input type="submit" value="Искать" />
    </form>
</body>
</html>
